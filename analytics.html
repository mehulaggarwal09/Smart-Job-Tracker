<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        JobTrack - Analytics
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/responsive.css">

</head>


<body>


    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            JobTrack
        </div>


        <nav class="sidebar-nav">

            <a
                href="index.html"
                class="nav-item">

                Dashboard

            </a>


            <a
                href="applications.html"
                class="nav-item">

                Applications

            </a>


            <a
                href="kanban.html"
                class="nav-item">

                Kanban Board

            </a>


            <a
                href="analytics.html"
                class="nav-item active">

                Analytics

            </a>


            <a
                href="settings.html"
                class="nav-item">

                Settings

            </a>

        </nav>

    </aside>



    <!-- Main Content -->

    <main class="main-content">


        <!-- Topbar -->

        <header class="topbar">

            <div>

                <h1>
                    Analytics
                </h1>

                <p>
                    Analyze your job search performance
                </p>

            </div>


            <button
                id="themeToggle"
                class="theme-toggle">

                🌙 Dark Mode

            </button>

        </header>



        <!-- Analytics -->

        <section class="analytics-container">


            <!-- Analytics Stats -->

            <div class="analytics-stats">


                <div class="analytics-stat-card">

                    <h3>
                        Total Applications
                    </h3>

                    <p id="analyticsTotal">
                        0
                    </p>

                </div>


                <div class="analytics-stat-card">

                    <h3>
                        Interview Rate
                    </h3>

                    <p id="analyticsInterviewRate">
                        0%
                    </p>

                </div>


                <div class="analytics-stat-card">

                    <h3>
                        Offer Rate
                    </h3>

                    <p id="analyticsOfferRate">
                        0%
                    </p>

                </div>


            </div>



            <!-- Applications by Status -->

            <div class="chart-card">

                <h2>
                    Applications by Status
                </h2>

                <div class="chart-container">

                    <canvas id="statusChart"></canvas>

                </div>

            </div>



            <!-- Applications Over Time -->

            <div class="chart-card">

                <h2>
                    Applications Over Time
                </h2>

                <div class="chart-container">

                    <canvas id="timelineChart"></canvas>

                </div>

            </div>


        </section>

    </main>



    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- Analytics JavaScript -->

    <script src="js/analytics.js"></script>


    <!-- Common Theme JavaScript -->

    <script src="js/theme.js"></script>

</body>

</html>
